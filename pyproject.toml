[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "study-engine"
version = "0.1.0"
description = "Motor de estudio y tutoría inteligente basado en evidencia y arquitectura multicapa"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Agustin" }
]
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pypdf>=6.19.0",
    "pyyaml>=6.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "httpx>=0.27.0",
    "numpy>=1.24.0",
    "pymupdf>=1.24.0",
    "python-multipart>=0.0.20",
]


[project.scripts]
talos = "study_engine.cli:main"

[project.optional-dependencies]
gate2-diagnostics = [
    "rapidfuzz>=3.0",
]
experiments = [
    "scipy>=1.10.0",
]
local-inference = [
    "onnxruntime>=1.17.0",
    "tokenizers>=0.15.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "flake8>=6.0",
    "mypy>=1.0",
    "types-PyYAML",
    "setuptools>=61.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = [
    "integration: marks tests as integration tests (require external services)",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "network: marks tests that require live network access to an external LLM provider",
    "live: marks tests requiring live external LLM API access and KASIU_LIVE_TESTS=1",
]
